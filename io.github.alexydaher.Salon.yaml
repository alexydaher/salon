# Flatpak manifest for Salon.
#
#   flatpak run org.flatpak.Builder --user --install --force-clean \
#     --disable-rofiles-fuse build-flatpak io.github.alexydaher.Salon.yaml
#   flatpak run io.github.alexydaher.Salon
#
# --disable-rofiles-fuse because org.flatpak.Builder can't spawn
# rofiles-fuse on every host; it only turns off a hardlink-protection
# layer over the build tree. Built and installed against the GNOME 50
# runtime on 2026-08-19 — 48 had been end-of-life since March, which
# Flathub refuses outright.
#
# Read the finish-args before shipping this. Salon's whole purpose is
# starting *other* applications, which is exactly what a sandbox exists to
# prevent, so this manifest asks for `org.freedesktop.Flatpak` — the
# host-spawn permission. That is, plainly, equivalent to unsandboxed access
# to the session bus and the user's login session. There is no version of a
# launcher that is both meaningfully confined and able to launch things;
# packaging Salon as a distro package or a Meson install is the more honest
# option, and this exists because §6.11 asks for it and because Flatpak is
# still the easiest way to hand someone a build.
#
# ---------------------------------------------------------------------
# For a Flathub submission: five linter errors survive here on purpose.
# `flatpak-builder-lint manifest` reports them; each is answered below,
# and these are the paragraphs to paste into the submission PR.
#
# finish-args-flatpak-spawn-access
#   Salon is a launcher. Starting host applications is not a feature it
#   has, it is the entire program, and `flatpak-spawn --host` is the only
#   route to it. Precedent: Bottles and other launchers ship with the same
#   grant. The trade-off is stated plainly above rather than buried.
#
# finish-args-only-wayland
#   No --socket=x11 or fallback-x11 because Salon is Wayland-only by
#   design (§2). It takes a RemoteDesktop portal grant to inject pointer
#   and keyboard events and relies on Wayland focus semantics throughout;
#   a silent X11 fallback would start, look right, and then behave wrongly
#   in ways a user could not diagnose. Refusing to run is the honest
#   outcome, and adding the socket to quiet a linter would be a lie.
#
# finish-args-direct-dconf-path / finish-args-dconf-talk-name
#   Two host GSettings keys, both *written*, both named in the finish-args
#   comment below. `org.freedesktop.portal.Settings` serves reads only, so
#   there is no portal that can replace a write. One of the two is
#   appliance-critical: a television that locks to a password prompt is a
#   television nobody on a sofa can unlock. Dropping the grant does not
#   fail loudly, it makes both features no-ops against the sandbox's own
#   dconf database, which is worse than asking for the permission.
#
# finish-args-login1-system-talk-name
#   Suspend, restart and shut down. `org.gnome.SessionManager` was the
#   obvious alternative and does not work here: it has no Suspend method
#   at all, it collapses CanReboot and CanPowerOff into a single
#   CanShutdown, and its Shutdown()/Reboot() raise GNOME's confirmation
#   dialog — a prompt rendered underneath a fullscreen kiosk, which is the
#   exact failure services/power.py's error reporting was written to fix.
# ---------------------------------------------------------------------
app-id: io.github.alexydaher.Salon
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: salon

finish-args:
  # Display, GPU and audio. No --socket=fallback-x11: Salon is Wayland-only
  # by design (§2) and a silent X11 fallback would hide that.
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio

  # Gamepads. libmanette reads evdev directly, so this needs the raw input
  # devices; --device=all is the only Flatpak grant that includes them.
  - --device=all

  # Artwork fetching (§7.4) and the phone-keyboard pairing server (§6.12),
  # which listens on the LAN while search is open.
  - --share=network
  - --share=ipc

  # Suspend/restart/shut down (§6.7) go to logind on the system bus. Salon
  # never shells out to systemctl.
  - --system-talk-name=org.freedesktop.login1

  # The screensaver inhibit taken around a launch (§6.4). No talk-name for
  # org.freedesktop.portal.Desktop: a sandboxed app can always reach the
  # portals, so asking for it is noise that a reviewer has to rule out.
  # Gamepad pointer control (§6.5) goes over the RemoteDesktop portal and
  # needs nothing here either.
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.freedesktop.ScreenSaver

  # The one that matters: launching host applications through
  # `flatpak-spawn --host`. See the note at the top of this file. This is
  # also what carries `wpctl` for volume (§6.8), which is a host binary
  # rather than a bus call — org.freedesktop.portal.Flatpak used to be
  # listed here for it, which was wrong twice over: that is the spawn
  # portal, not PipeWire, and portals need no talk-name.
  - --talk-name=org.freedesktop.Flatpak

  # Deliberately absent: --talk-name=org.gnome.Mutter.RemoteDesktop.
  #
  # Outside the sandbox Salon prefers mutter's own remote-desktop
  # interface, because it grants pointer and keyboard injection with no
  # consent dialog — which is the only way a television with no keyboard
  # and no mouse can finish pairing its first phone (the portal's dialog
  # can only be dismissed with the pointer it is gating). That is the right
  # trade for an appliance you install yourself with a distro package.
  #
  # It is the wrong trade for a Flathub build. That name is system-wide
  # input injection with no revocation and no prompt, and a sandboxed app
  # holding it has escaped the thing the sandbox is for. So the name is not
  # listed, `call_sync` against it fails immediately inside the sandbox,
  # and `input-injection=auto` falls through to the portal on its own — the
  # Flatpak gets the consent dialog, once, as it should. Nothing needs to
  # be configured for this; the absence of the line *is* the configuration.

  # Two host GSettings keys, and both are *written*, which is why the
  # Settings portal cannot replace this and Flathub's linter complaint
  # about direct dconf has to be answered with a justification instead:
  #
  #   org.gnome.desktop.screensaver lock-enabled      services/screenlock.py
  #   org.gnome.desktop.a11y.applications
  #                     screen-keyboard-enabled       services/pointer_injector.py
  #
  # The first is the appliance one. A television that locks to a password
  # prompt is a television nobody on a sofa can unlock, so Salon clears
  # `lock-enabled` while it owns the session and puts it back on shutdown.
  # The second is the "Y = keyboard" affordance in gamepad pointer mode:
  # Salon cannot draw an OSK above another app's Wayland surface, so it
  # borrows GNOME's shell-level one and clicks it with the injected cursor.
  #
  # `org.freedesktop.portal.Settings` serves reads and only reads, so
  # without these four lines both features become silent no-ops against
  # the sandbox's own dconf database. Reduced motion, which this comment
  # used to claim as the reason, needs nothing here: it comes from Salon's
  # own schema plus `Gtk.Settings:gtk-enable-animations`, which GTK already
  # feeds from the Settings portal inside a sandbox.
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf

  # Nothing for xdg-config/salon, xdg-data/salon or xdg-cache/salon. A
  # sandboxed app already owns its own XDG dirs, so those three grants only
  # bought one thing: writing to the *host's* ~/.config/salon and sharing
  # tiles.json with an unsandboxed Salon. That is not what a Flatpak is for,
  # and Flathub's linter says so. Inside the sandbox the catalogue, the
  # artwork drop folder and the per-tile browser profiles all live under
  # ~/.var/app/io.github.alexydaher.Salon/, which the host browser launched
  # by flatpak-spawn can still read by path.

modules:
  - name: libmanette
    buildsystem: meson
    config-opts:
      - -Dintrospection=true
      - -Dvapi=false
      - -Dgudev=enabled
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/libmanette.git
        tag: '0.2.9'
        # Flathub wants every git source pinned to a hash as well as a tag,
        # because a tag can be moved and a hash cannot. This one is an
        # external repository, so unlike the salon module below there is
        # nothing self-referential about naming it. 0.2.9 is an annotated
        # tag; this is the commit it points at, not the tag object.
        commit: 508df238f9c25a20c0d06da8c9bf83138759d40f

  - name: salon
    buildsystem: meson
    sources:
      # A published manifest has to name an immutable ref: `type: dir` built
      # only from a checkout on the author's own disk, which is useless to
      # anyone else and unreproducible. Bump the tag with the version, and
      # the <screenshots> URLs in the metainfo with it.
      #
      # No `commit:` here, deliberately. Flathub wants a git source pinned to
      # a hash as well as a tag, but this manifest is *inside* the repository
      # it builds, and no commit can contain its own hash. That is why a
      # Flathub submission is a separate flathub/io.github.alexydaher.Salon
      # repository holding a copy of this file with the hash filled in; this
      # one stays tag-only, for building the app from a clean checkout.
      - type: git
        url: https://github.com/alexydaher/salon.git
        tag: v0.2.0
