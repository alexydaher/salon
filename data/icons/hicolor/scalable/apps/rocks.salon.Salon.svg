<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Salon's application icon.

       The mark is the home screen itself, reduced to its one idea: a grid of
       tiles with exactly one of them lit. Everything Salon does visually —
       the focus ring, the bloom, the accent — is that single lit tile, so the
       icon is drawn from the same tokens as the interface (surface-0
       #0E1116, surface-2 #1F2630, accent #E8A33D).

       Note the comment is *inside* the svg element. gdk-pixbuf sniffs only
       the first chunk of a file to pick a loader, and a comment this long
       between the XML declaration and <svg> pushes the element out of that
       window — the loader then refuses the file outright and the icon simply
       doesn't appear anywhere in the shell. -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2029"/>
      <stop offset="1" stop-color="#0E1116"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5BE63"/>
      <stop offset="1" stop-color="#E8A33D"/>
    </linearGradient>
    <filter id="bloom" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="27" fill="url(#field)"/>

  <!-- the light the focused tile casts on its neighbours -->
  <rect x="20" y="46" width="46" height="30" rx="8" fill="#E8A33D" opacity="0.55"
        filter="url(#bloom)"/>

  <g fill="#1F2630">
    <rect x="72" y="46" width="36" height="30" rx="7"/>
    <rect x="20" y="86" width="36" height="22" rx="6"/>
    <rect x="62" y="86" width="46" height="22" rx="6"/>
    <rect x="20" y="22" width="88" height="12" rx="6" opacity="0.55"/>
  </g>

  <rect x="20" y="46" width="46" height="30" rx="8" fill="url(#lit)"/>
</svg>
