#
# The gates from scripts/check.sh, run on every push. They were already the
# rule ("must exit 0 before any milestone is considered done") and were
# enforced by whoever remembered to type it.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-24.04
    container: fedora:41
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf install -y \
            python3-gobject python3-cairo python3-pytest python3-ruff python3-mypy \
            gtk4-devel libadwaita-devel libsoup3-devel gdk-pixbuf2-devel \
            libmanette-devel glib2-devel meson ninja-build \
            desktop-file-utils appstream adwaita-icon-theme \
            xorg-x11-server-Xvfb dbus-x11 weston

      # pytest comes from apt, not pipx: it has to import gi, and a pipx
      # venv is isolated from the system site-packages PyGObject lives in.
      # ruff and mypy are standalone (gi.* is ignore_missing_imports in
      # pyproject.toml), so an isolated install is right for them.
      # libglib2.0-dev is not decoration: it brings glib-compile-resources,
      # without which `meson setup` fails outright at gnome.compile_resources.
      # This workflow was written before there was a repository to run it in,
      # so its first real execution was also the first time anyone found out.

      - name: ruff
        run: ruff check salon tests

      - name: mypy --strict (salon.core, salon.input)
        run: mypy --strict salon/core salon/input

      # Under Xvfb so the tests that resolve icon names against a real theme
      # run rather than skipping — that check exists because a typo in an
      # icon name is invisible until it renders as a broken square on a
      # television.
      - name: pytest
        run: xvfb-run -a python3 -m pytest -q
        env:
          PYTHONPATH: .

      - name: meson compile
        run: |
          meson setup build
          meson compile -C build

      - name: Reject missing or too-old native dependencies
        run: python3 scripts/meson-negative-dependencies.py

      - name: Wayland smoke test
        run: bash scripts/wayland-smoke.sh

      - name: Upload Wayland smoke frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayland-smoke-frame
          path: build/meson-logs/wayland-smoke.png
          if-no-files-found: warn

      - name: meson test (AppStream and desktop entry validation)
        run: meson test -C build --print-errorlogs

      - name: meson install into a staging prefix
        run: DESTDIR="$PWD/staging" meson install -C build
