# SPDX-License-Identifier: GPL-3.0-or-later
# Release: a v* tag builds the Flatpak and Debian packages, signs both
# repositories, publishes the GitHub release and deploys Pages. It runs no
# gates. Those are ci.yml's, on every push to main, and a tag only ever lands
# on a commit that already went green there — cut-release.py waits for that,
# and the `version` job below refuses a commit that has no green CI run.
#
# CI and release were one workflow from 0.3.2 until 0.4.7, which left every
# main run listing six skipped release jobs. Splitting on the trigger means
# `git push origin main vVERSION` still starts exactly one run per ref.
name: Salon release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gates are not here, so this checks that they have passed: a tag
  # pushed by hand onto a commit main never went green on stops before
  # anything is built, signed or published. `branch=main` is what keeps a
  # tag's own run from vouching for itself — it reports the tag as its branch.
  version:
    name: Check release metadata
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a green CI run on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=success" \
            --jq '.total_count')"
          if [ "$passed" -lt 1 ]; then
            echo "::error::${GITHUB_SHA::7} has no successful CI run on main. Push main, wait for it to go green, then re-run this workflow."
            exit 1
          fi
          echo "${GITHUB_SHA::7} passed the gates on main ($passed successful run(s))."

      - name: Check version consistency
        run: python3 scripts/prepare-flatpak-release.py --require-changelog

      - name: Prepare the commit-pinned Flathub manifest
        run: |
          release_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          python3 scripts/prepare-flatpak-release.py \
            --tag "$GITHUB_REF_NAME" \
            --commit "$release_commit" \
            --output "release/io.github.alexydaher.Salon.yaml"

      - name: Upload the prepared Flathub manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flathub-manifest-${{ github.ref_name }}
          path: release/io.github.alexydaher.Salon.yaml
          if-no-files-found: error

  flatpak:
    name: Build Flatpak (${{ matrix.variant.arch }})
    timeout-minutes: 60
    needs: version
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The checked-in manifest names `tag:` with no `commit:`, because no
      # commit can contain its own hash. Left alone, flatpak-builder would
      # re-resolve that tag when it clones, so a tag moved between the trigger
      # and the clone would ship code this run never gated. Pin it to the
      # triggering commit instead. build-manifest/ matches the `build-*/` rule
      # in .gitignore, so the working tree stays clean.
      - name: Pin the manifest to the triggering commit
        run: |
          python3 scripts/prepare-flatpak-release.py \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --output build-manifest/io.github.alexydaher.Salon.yaml
          grep -q "commit: $GITHUB_SHA" build-manifest/io.github.alexydaher.Salon.yaml

      - name: Build and bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          manifest-path: build-manifest/io.github.alexydaher.Salon.yaml
          bundle: Salon-${{ github.ref_name }}-${{ matrix.variant.arch }}.flatpak
          arch: ${{ matrix.variant.arch }}
          cache-key: flatpak-builder-${{ github.sha }}
          verbose: true

      - name: Smoke-test installed bundle under Wayland
        if: matrix.variant.arch == 'x86_64'
        run: |
          test -s /etc/machine-id || dbus-uuidgen --ensure=/etc/machine-id
          bundle=$(find . -maxdepth 2 -name 'Salon-*.flatpak' -print -quit)
          test -n "$bundle"
          scripts/flatpak-wayland-smoke.sh "$bundle"

  debian:
    name: Build Debian package
    timeout-minutes: 30
    needs: version
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Install package build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git \
            build-essential debhelper dh-python devscripts lintian \
            meson ninja-build python3 python3-gi \
            libgtk-4-dev libadwaita-1-dev libsoup-3.0-dev \
            libgdk-pixbuf-2.0-dev libglib2.0-dev libmanette-0.2-dev \
            desktop-file-utils appstream

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and inspect the package
        run: |
          dpkg-buildpackage --build=binary --no-sign
          mkdir -p release
          find .. -maxdepth 1 -type f -name 'salon_*.deb' \
            -exec cp --target-directory=release {} +
          test "$(find release -name 'salon_*.deb' | wc -l)" -eq 1
          lintian --fail-on error release/salon_*.deb

      - name: Upload Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salon-deb-${{ github.ref_name }}
          path: release/*.deb
          if-no-files-found: error

  repository:
    name: Prepare signed repositories
    timeout-minutes: 20
    needs:
      - flatpak
      - debian
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    env:
      FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - name: Install repository tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git flatpak gnupg ostree python3 \
            apt-utils dpkg-dev gzip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Flatpak bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Salon-${{ github.ref_name }}-*.flatpak
          path: bundles
          merge-multiple: true

      - name: Import signing key
        id: signing-key
        shell: bash
        run: |
          test -n "$FLATPAK_GPG_PRIVATE_KEY" || {
            echo 'The FLATPAK_GPG_PRIVATE_KEY repository secret is required.' >&2
            exit 1
          }
          install -d -m 0700 "$RUNNER_TEMP/flatpak-gnupg"
          printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" \
            | base64 --decode \
            | gpg --homedir "$RUNNER_TEMP/flatpak-gnupg" --batch --import
          fingerprint="$({
            gpg --homedir "$RUNNER_TEMP/flatpak-gnupg" \
              --batch --with-colons --list-secret-keys
          } | awk -F: '$1 == "sec" { primary = 1; next } primary && $1 == "fpr" { print $10; exit }')"
          test -n "$fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          mkdir -p site/repo
          ostree init --repo=site/repo --mode=archive-z2
          gpg --homedir "$RUNNER_TEMP/flatpak-gnupg" --batch \
            --output site/salon.gpg --export "$fingerprint"

      - name: Create signed repository and installer
        env:
          SIGNING_FINGERPRINT: ${{ steps.signing-key.outputs.fingerprint }}
        run: |
          bundle_count=0
          for bundle in bundles/*.flatpak; do
            flatpak build-import-bundle \
              --gpg-sign="$SIGNING_FINGERPRINT" \
              --gpg-homedir="$RUNNER_TEMP/flatpak-gnupg" \
              --update-appstream \
              site/repo "$bundle"
            bundle_count=$((bundle_count + 1))
          done
          test "$bundle_count" -eq 2
          flatpak build-update-repo \
            --title=Salon \
            --comment='Official Salon releases' \
            --description='Signed Flatpak releases of the Salon living-room launcher' \
            --homepage='https://github.com/alexydaher/salon' \
            --default-branch=master \
            --gpg-import=site/salon.gpg \
            --gpg-sign="$SIGNING_FINGERPRINT" \
            --gpg-homedir="$RUNNER_TEMP/flatpak-gnupg" \
            site/repo
          python3 scripts/prepare-flatpak-repository.py \
            --public-key site/salon.gpg \
            --output-dir site

      # APT can be given its own key, but does not need one: the same
      # publisher signs both archives from the same job, so a second key
      # buys no isolation and doubles what has to be backed up. Setting
      # APT_GPG_PRIVATE_KEY switches to a dedicated one without a code
      # change; leaving it unset reuses the release key. Which one was used
      # is printed, because a signing key is not a thing to guess about.
      - name: Choose the APT archive signing key
        id: apt-signing-key
        shell: bash
        env:
          FLATPAK_FINGERPRINT: ${{ steps.signing-key.outputs.fingerprint }}
        run: |
          if [ -n "$APT_GPG_PRIVATE_KEY" ]; then
            install -d -m 0700 "$RUNNER_TEMP/apt-gnupg"
            printf '%s' "$APT_GPG_PRIVATE_KEY" \
              | base64 --decode \
              | gpg --homedir "$RUNNER_TEMP/apt-gnupg" --batch --import
            fingerprint="$({
              gpg --homedir "$RUNNER_TEMP/apt-gnupg" \
                --batch --with-colons --list-secret-keys
            } | awk -F: '$1 == "sec" { primary = 1; next } primary && $1 == "fpr" { print $10; exit }')"
            test -n "$fingerprint"
            homedir="$RUNNER_TEMP/apt-gnupg"
            echo 'Signing the APT archive with the dedicated APT key.'
          else
            fingerprint="$FLATPAK_FINGERPRINT"
            homedir="$RUNNER_TEMP/flatpak-gnupg"
            echo 'No APT_GPG_PRIVATE_KEY secret: signing the APT archive with the release key.'
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "homedir=$homedir" >> "$GITHUB_OUTPUT"

      - name: Download Debian package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salon-deb-${{ github.ref_name }}
          path: debian-package

      # The script ends by running a real apt against what it just wrote, in
      # a private apt tree trusting this keyring alone. Generated archive
      # metadata looks correct whether or not a client accepts it.
      - name: Build the signed APT archive
        env:
          APT_GPG_HOMEDIR: ${{ steps.apt-signing-key.outputs.homedir }}
          APT_FINGERPRINT: ${{ steps.apt-signing-key.outputs.fingerprint }}
        run: |
          package="$(find debian-package -maxdepth 1 -name 'salon_*_all.deb' -print -quit)"
          test -n "$package"
          scripts/build-apt-repository.sh \
            --deb "$package" \
            --output site/apt \
            --gpg-homedir "$APT_GPG_HOMEDIR" \
            --fingerprint "$APT_FINGERPRINT"

      # One artifact, one deployment. A second upload-pages-artifact or a
      # second deploy-pages replaces the whole site rather than adding to
      # it, which would take the Flatpak repository off the air.
      - name: Upload Pages repository
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Upload installer metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak-repository-metadata-${{ github.ref_name }}
          path: |
            site/io.github.alexydaher.Salon.flatpakref
            site/salon.flatpakrepo
            site/salon.gpg
          if-no-files-found: error

  # Deployed last, and deliberately after the GitHub release. Pages is the
  # only irreversible, user-visible step here: once the signed repository is
  # live, every installed copy takes the update on its next `flatpak update`.
  # Deploying it first meant a failure in the release job shipped new code to
  # existing users with no release behind it. This way round the bad outcome
  # is a release whose .flatpakref still serves the previous version, which
  # leaves users on a working build and is fixed by re-running one job.
  pages:
    name: Publish download repositories
    timeout-minutes: 15
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  release:
    name: Publish GitHub release
    timeout-minutes: 15
    needs:
      - version
      - flatpak
      - debian
      - repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download prepared manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flathub-manifest-${{ github.ref_name }}
          path: release

      - name: Download Flatpak bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # flatpak-builder@v6 names each artifact from the bundle and adds
          # the architecture, for example
          # Salon-v0.2.2-x86_64-x86_64.flatpak.
          pattern: Salon-${{ github.ref_name }}-*.flatpak
          path: release
          merge-multiple: true

      - name: Download Debian package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: salon-deb-${{ github.ref_name }}
          path: release

      - name: Download Flatpak repository installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-repository-metadata-${{ github.ref_name }}
          path: release

      - name: Write checksums
        run: |
          cd release
          sha256sum -- * > SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --title "Salon ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
