# SPDX-License-Identifier: GPL-3.0-or-later
# One tag-triggered run owns the complete release: quality gates first,
# followed by metadata validation, packaging, repository deployment and
# publication. Pull requests exercise the same gates without entering any
# tag-only release job.
name: Salon release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-24.04
    container: fedora:41
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf install -y \
            python3-gobject python3-cairo python3-pytest python3-ruff python3-mypy \
            gtk4-devel libadwaita-devel libsoup3-devel gdk-pixbuf2-devel \
            libmanette-devel glib2-devel meson ninja-build \
            desktop-file-utils appstream adwaita-icon-theme \
            xorg-x11-server-Xvfb dbus-x11 weston

      - name: ruff
        run: ruff check .

      - name: mypy --strict (salon.core, salon.input)
        run: mypy --strict salon/core salon/input

      - name: pytest
        run: xvfb-run -a python3 -m pytest -q
        env:
          PYTHONPATH: .

      - name: meson compile
        run: |
          meson setup build
          meson compile -C build

      - name: Reject missing or too-old native dependencies
        run: python3 scripts/meson-negative-dependencies.py

      - name: Wayland smoke test
        run: bash scripts/wayland-smoke.sh

      - name: Upload Wayland smoke frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayland-smoke-frame
          path: build/meson-logs/wayland-smoke.png
          if-no-files-found: warn

      - name: meson test (AppStream and desktop entry validation)
        run: meson test -C build --print-errorlogs

      - name: meson install into a staging prefix
        run: DESTDIR="$PWD/staging" meson install -C build

  version:
    name: Check release metadata
    needs: gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version consistency
        run: python3 scripts/prepare-flatpak-release.py

      - name: Prepare the commit-pinned Flathub manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          release_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          python3 scripts/prepare-flatpak-release.py \
            --tag "$GITHUB_REF_NAME" \
            --commit "$release_commit" \
            --output "release/io.github.alexydaher.Salon.yaml"

      - name: Upload the prepared Flathub manifest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: flathub-manifest-${{ github.ref_name }}
          path: release/io.github.alexydaher.Salon.yaml
          if-no-files-found: error

  flatpak:
    name: Build Flatpak (${{ matrix.variant.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: version
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build and bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.alexydaher.Salon.yaml
          bundle: Salon-${{ github.ref_name }}-${{ matrix.variant.arch }}.flatpak
          arch: ${{ matrix.variant.arch }}
          cache-key: flatpak-builder-${{ github.sha }}
          verbose: true

      - name: Smoke-test installed bundle under Wayland
        if: matrix.variant.arch == 'x86_64'
        run: |
          test -s /etc/machine-id || dbus-uuidgen --ensure=/etc/machine-id
          bundle=$(find . -maxdepth 2 -name 'Salon-*.flatpak' -print -quit)
          test -n "$bundle"
          scripts/flatpak-wayland-smoke.sh "$bundle"

  debian:
    name: Build Debian package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: version
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Install package build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git \
            build-essential debhelper dh-python devscripts lintian \
            meson ninja-build python3 python3-gi \
            libgtk-4-dev libadwaita-1-dev libsoup-3.0-dev \
            libgdk-pixbuf-2.0-dev libglib2.0-dev libmanette-0.2-dev \
            desktop-file-utils appstream

      - uses: actions/checkout@v4

      - name: Build and inspect the package
        run: |
          dpkg-buildpackage --build=binary --no-sign
          mkdir -p release
          find .. -maxdepth 1 -type f -name 'salon_*.deb' \
            -exec cp --target-directory=release {} +
          test "$(find release -name 'salon_*.deb' | wc -l)" -eq 1
          lintian --fail-on error release/salon_*.deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: salon-deb-${{ github.ref_name }}
          path: release/*.deb
          if-no-files-found: error

  flatpak-repository:
    name: Prepare signed Flatpak repository
    if: startsWith(github.ref, 'refs/tags/v')
    needs: flatpak
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    env:
      FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
    steps:
      - name: Install repository tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git flatpak gnupg ostree python3

      - uses: actions/checkout@v4

      - name: Download Flatpak bundles
        uses: actions/download-artifact@v4
        with:
          pattern: Salon-${{ github.ref_name }}-*.flatpak
          path: bundles
          merge-multiple: true

      - name: Import signing key
        id: signing-key
        shell: bash
        run: |
          test -n "$FLATPAK_GPG_PRIVATE_KEY" || {
            echo 'The FLATPAK_GPG_PRIVATE_KEY repository secret is required.' >&2
            exit 1
          }
          install -d -m 0700 "$RUNNER_TEMP/flatpak-gnupg"
          printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" \
            | base64 --decode \
            | gpg --homedir "$RUNNER_TEMP/flatpak-gnupg" --batch --import
          fingerprint="$({
            gpg --homedir "$RUNNER_TEMP/flatpak-gnupg" \
              --batch --with-colons --list-secret-keys
          } | awk -F: '$1 == "sec" { primary = 1; next } primary && $1 == "fpr" { print $10; exit }')"
          test -n "$fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          mkdir -p site/repo
          ostree init --repo=site/repo --mode=archive-z2
          gpg --homedir "$RUNNER_TEMP/flatpak-gnupg" --batch \
            --output site/salon.gpg --export "$fingerprint"

      - name: Create signed repository and installer
        env:
          SIGNING_FINGERPRINT: ${{ steps.signing-key.outputs.fingerprint }}
        run: |
          bundle_count=0
          for bundle in bundles/*.flatpak; do
            flatpak build-import-bundle \
              --gpg-sign="$SIGNING_FINGERPRINT" \
              --gpg-homedir="$RUNNER_TEMP/flatpak-gnupg" \
              --update-appstream \
              site/repo "$bundle"
            bundle_count=$((bundle_count + 1))
          done
          test "$bundle_count" -eq 2
          flatpak build-update-repo \
            --title=Salon \
            --comment='Official Salon releases' \
            --description='Signed Flatpak releases of the Salon living-room launcher' \
            --homepage='https://github.com/alexydaher/salon' \
            --default-branch=master \
            --gpg-import=site/salon.gpg \
            --gpg-sign="$SIGNING_FINGERPRINT" \
            --gpg-homedir="$RUNNER_TEMP/flatpak-gnupg" \
            site/repo
          python3 scripts/prepare-flatpak-repository.py \
            --public-key site/salon.gpg \
            --output-dir site

      - name: Upload Pages repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload installer metadata
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repository-metadata-${{ github.ref_name }}
          path: |
            site/io.github.alexydaher.Salon.flatpakref
            site/salon.flatpakrepo
            site/salon.gpg
          if-no-files-found: error

  pages:
    name: Publish Flatpak repository
    if: startsWith(github.ref, 'refs/tags/v')
    needs: flatpak-repository
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - version
      - flatpak
      - debian
      - flatpak-repository
      - pages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download prepared manifest
        uses: actions/download-artifact@v4
        with:
          name: flathub-manifest-${{ github.ref_name }}
          path: release

      - name: Download Flatpak bundles
        uses: actions/download-artifact@v4
        with:
          # flatpak-builder@v6 names each artifact from the bundle and adds
          # the architecture, for example
          # Salon-v0.2.2-x86_64-x86_64.flatpak.
          pattern: Salon-${{ github.ref_name }}-*.flatpak
          path: release
          merge-multiple: true

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: salon-deb-${{ github.ref_name }}
          path: release

      - name: Download Flatpak repository installer
        uses: actions/download-artifact@v4
        with:
          name: flatpak-repository-metadata-${{ github.ref_name }}
          path: release

      - name: Write checksums
        run: |
          cd release
          sha256sum -- * > SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --title "Salon ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
