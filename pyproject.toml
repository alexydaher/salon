[project]
name = "salon"
version = "0.1.0"
description = "A fullscreen, remote- and controller-driven launcher for GNOME"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["salon.core", "salon.input"]
exclude = ["build", ".venv"]

[[tool.mypy.overrides]]
module = "gi.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
